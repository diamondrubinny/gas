name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP syntax
        run: find plugins themes tests scripts -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 -P4 php -l
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.php == '8.3'
        with:
          node-version: '22'
      - name: JS syntax
        if: matrix.php == '8.3'
        run: node scripts/check-js.js
      - name: Version consistency
        if: matrix.php == '8.3'
        run: |
          f=plugins/gas-safety-manager/gas-safety-manager.php
          h=$(sed -n 's/^ \* Version: *//p' "$f" | head -1)
          c=$(sed -n "s/^define( 'GSM_VERSION', '\([^']*\)' );/\1/p" "$f")
          s=$(sed -n 's/^Stable tag: *//p' plugins/gas-safety-manager/readme.txt | head -1)
          echo "header=$h constant=$c stable=$s"
          test "$h" = "$c" && test "$c" = "$s"

  phpcs:
    name: PHPCS (security + compatibility)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install dev tools
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS — blocking (phpcs.xml.dist)
        run: vendor/bin/phpcs
      - name: PHPCS — WordPress style (advisory)
        continue-on-error: true
        run: vendor/bin/phpcs --standard=WordPress-Extra --report=summary --extensions=php plugins/gas-safety-manager themes/gas-safety-theme

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: none
      - run: php tests/bi-token-test.php plugins/gas-safety-manager
      - run: php tests/csv-injection-test.php plugins/gas-safety-manager
      - run: php tests/csv-reader-test.php plugins/gas-safety-manager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: QR codes decode back exactly (incl. UTF-8)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          # System packages (mostly extra fonts) come from the Ubuntu mirror,
          # which is sometimes unreachable from the runner. The runner image
          # already has what headless Chromium needs, so this is best-effort.
          timeout 180 npx playwright install-deps chromium || echo "::warning::Could not install optional browser system packages (apt mirror unreachable); continuing."
          node tests/qr-test.js plugins/gas-safety-manager

  e2e:
    name: E2E (WordPress ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported ("Requires at least: 6.4") and the current release.
        wp: ['6.4.5', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, zip, gd
          coverage: none
          tools: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          # System packages (mostly extra fonts) come from the Ubuntu mirror,
          # which is sometimes unreachable from the runner. The runner image
          # already has what headless Chromium needs, so this is best-effort.
          timeout 180 npx playwright install-deps chromium || echo "::warning::Could not install optional browser system packages (apt mirror unreachable); continuing."
      - name: Throwaway admin password
        run: |
          pass="$(openssl rand -hex 16)"
          echo "::add-mask::$pass"
          echo "WP_TEST_PASS=$pass" >> "$GITHUB_ENV"
      - name: Set up test WordPress (SQLite)
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: scripts/setup-test-wp.sh "$RUNNER_TEMP/wp" 8899
      - name: Integration — data retention (real WordPress + DB)
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/retention-test.php
      - name: Integration — code-review security / data fixes (real WordPress + DB)
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/security-fixes-test.php
      - name: "Integration — privacy requests: scan + anonymize everywhere (real WordPress + DB)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/privacy-requests-test.php
      - name: "Integration — pull from the old system (mock server): check, pull, re-pull, errors"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/legacy-pull-test.php
      - name: "Integration — two-factor authentication (RFC vectors, login paths, lockout, policy)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/twofa-test.php
      - name: "Integration — equipment fields added in DB v9"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/equipment-fields-test.php
      - name: "Integration — field messages + feedback (permissions, isolation, retention, privacy)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/messages-test.php
      - name: "Integration — named public-dashboard links (tokens, counter, revoke, boundaries)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/public-links-test.php
      - name: "Integration — users import (shapes, roles, PIN never stored, existing untouched)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/users-import-test.php
      - name: "Integration — passkeys (software authenticator: ES256 + RS256, all rejection paths)"
        run: php "$RUNNER_TEMP/wp/cache/wp-cli.phar" --allow-root --path="$RUNNER_TEMP/wp/site" eval-file tests/integration/passkeys-test.php
      - name: Public dashboard test
        run: node tests/public-dashboard-test.js plugins/gas-safety-manager/public/gas-public-dashboard.html
      - name: End-to-end (CSP, all screens, actions, attachments, bridge)
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
          WP_PATH: ${{ runner.temp }}/wp/site
        run: PASS="$WP_TEST_PASS" node tests/e2e/csp-e2e.js
      - name: Chat widget — click-to-load, CSP scoping, placements (simulated chat server)
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/chat-e2e.js
      - name: Privacy requests UI (file -> scan -> reject) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/privacy-e2e.js
      - name: Pull-from-old-site screen (settings, real 401, report rendering) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/legacy-e2e.js
      - name: QR issuance — scan link + copy on every record + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/qrissue-e2e.js
      - name: Two-factor login in the browser (enroll, login, mandatory policy) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/twofa-e2e.js
      - name: Forms right after login (nonce, validation retry, new fields, attachment) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/forms-e2e.js
      - name: Field messages + feedback on the dashboard (user and manager) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/messages-e2e.js
      - name: Gap features (a11y menu, dashboard layout, public links, SAP export, scan reset) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/gaps-e2e.js
      - name: Users import through the screen (upload, preview, create) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/users-import-e2e.js
      - name: Passkeys in the browser (virtual authenticator; site served as gas.localhost) + axe
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" WP_CLI="$RUNNER_TEMP/wp/cache/wp-cli.phar" WP_PATH="$RUNNER_TEMP/wp/site" node tests/e2e/passkeys-e2e.js
      - name: Layout — header contrast on gradient + chart height (desktop + mobile)
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/layout-e2e.js
      - name: Accessibility — keyboard & focus management
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/keyboard-a11y.js
      - name: Accessibility — axe-core WCAG 2.1 A/AA scan (all screens, forms, bridge, dashboard)
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/a11y-audit.js --report "$RUNNER_TEMP/a11y-report.json"
      - name: Public QR API — data minimisation + rate limits (trips the per-IP limit)
        env:
          BASE: http://127.0.0.1:8899
          USER_NAME: admin
        run: PASS="$WP_TEST_PASS" node tests/e2e/bridge-privacy.js
      - name: Integration — uninstall leaves no data behind (destructive, runs last)
        run: tests/integration/uninstall-test.sh "$RUNNER_TEMP/wp/site" "$RUNNER_TEMP/wp/cache/wp-cli.phar"
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report-wp-${{ matrix.wp }}
          path: ${{ runner.temp }}/a11y-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/wp/server.log" || true

  release-zips:
    name: Build ZIPs
    runs-on: ubuntu-24.04
    needs: [phpcs, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-safety-zips
          path: dist/*.zip
          retention-days: 14
